<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e82e6"/>
      <stop offset="60%" stop-color="#0055bb"/>
      <stop offset="100%" stop-color="#002d8a"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#001a5a" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Outer gold ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#ffd700" stroke-width="12" opacity="0.85"/>
  <!-- Inner subtle ring -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="white" stroke-width="2" opacity="0.25"/>
  <!-- Central circle glow -->
  <circle cx="256" cy="256" r="190" fill="white" opacity="0.07"/>
  <!-- Speed lines (gold, radial) -->
  <g stroke="#ffd700" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <line x1="256" y1="80"  x2="256" y2="48"/>
    <line x1="362" y1="120" x2="381" y2="94"/>
    <line x1="432" y1="256" x2="464" y2="256"/>
    <line x1="362" y1="392" x2="381" y2="418"/>
    <line x1="256" y1="432" x2="256" y2="464"/>
    <line x1="150" y1="392" x2="131" y2="418"/>
    <line x1="80"  y1="256" x2="48"  y2="256"/>
    <line x1="150" y1="120" x2="131" y2="94"/>
  </g>
  <!-- Central "+" symbol -->
  <g filter="url(#shadow)">
    <rect x="224" y="130" width="64" height="252" rx="10" fill="white"/>
    <rect x="130" y="224" width="252" height="64" rx="10" fill="white"/>
  </g>
  <!-- Corner symbols (smaller) -->
  <!-- Top-left: minus -->
  <rect x="98" y="124" width="60" height="14" rx="5" fill="white" opacity="0.82"/>
  <!-- Top-right: × -->
  <g opacity="0.82" transform="translate(354,131) rotate(45)">
    <rect x="-30" y="-7" width="60" height="14" rx="5" fill="white"/>
    <rect x="-7" y="-30" width="14" height="60" rx="5" fill="white"/>
  </g>
  <!-- Bottom-left: = -->
  <g opacity="0.82">
    <rect x="98" y="367" width="60" height="12" rx="5" fill="white"/>
    <rect x="98" y="388" width="60" height="12" rx="5" fill="white"/>
  </g>
  <!-- Bottom-right: ÷ -->
  <g opacity="0.82">
    <rect x="354" y="378" width="60" height="13" rx="5" fill="white"/>
    <circle cx="384" cy="363" r="8" fill="white"/>
    <circle cx="384" cy="403" r="8" fill="white"/>
  </g>
  <!-- Shine highlight -->
  <ellipse cx="190" cy="165" rx="80" ry="50" fill="white" opacity="0.08" transform="rotate(-30,190,165)"/>
</svg>
