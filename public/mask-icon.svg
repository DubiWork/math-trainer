<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e82e6"/>
      <stop offset="60%" stop-color="#0055bb"/>
      <stop offset="100%" stop-color="#002d8a"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed background (maskable safe zone is centre 80%) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Outer gold ring -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="#ffd700" stroke-width="14" opacity="0.85"/>
  <!-- Speed lines -->
  <g stroke="#ffd700" stroke-width="8" stroke-linecap="round" opacity="0.5">
    <line x1="256" y1="78"  x2="256" y2="45"/>
    <line x1="434" y1="256" x2="467" y2="256"/>
    <line x1="256" y1="434" x2="256" y2="467"/>
    <line x1="78"  y1="256" x2="45"  y2="256"/>
    <line x1="372" y1="115" x2="393" y2="88"/>
    <line x1="372" y1="397" x2="393" y2="424"/>
    <line x1="140" y1="115" x2="119" y2="88"/>
    <line x1="140" y1="397" x2="119" y2="424"/>
  </g>
  <!-- "+" symbol -->
  <rect x="220" y="120" width="72" height="272" rx="12" fill="white"/>
  <rect x="120" y="220" width="272" height="72" rx="12" fill="white"/>
  <!-- Small corner math symbols -->
  <rect x="90" y="118" width="66" height="16" rx="6" fill="white" opacity="0.80"/>
  <g opacity="0.80" transform="translate(357,126) rotate(45)">
    <rect x="-33" y="-8" width="66" height="16" rx="6" fill="white"/>
    <rect x="-8" y="-33" width="16" height="66" rx="6" fill="white"/>
  </g>
  <rect x="90" y="370" width="66" height="14" rx="6" fill="white" opacity="0.80"/>
  <rect x="90" y="392" width="66" height="14" rx="6" fill="white" opacity="0.80"/>
  <rect x="358" y="381" width="66" height="14" rx="6" fill="white" opacity="0.80"/>
  <circle cx="391" cy="364" r="9" fill="white" opacity="0.80"/>
  <circle cx="391" cy="409" r="9" fill="white" opacity="0.80"/>
</svg>
